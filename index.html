<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silent E Ninja Dojo: Long Vowel VCe Phonics Game</title>
<meta name="description" content="A ninja-themed phonics game for 2nd graders to master long vowel silent e (VCe) words like cake, bike, home, and cube. Created by The Vanpool School.">
<meta name="theme-color" content="#0b0f2a">
<meta property="og:title" content="Silent E Ninja Dojo">
<meta property="og:description" content="Sneak the silent e to the end of the word and make the vowel say its name! A long vowel VCe phonics game for 2nd grade.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='52' r='44' fill='%23262b66'/%3E%3Cpath d='M12 46Q50 34 88 46V66Q50 78 12 66Z' fill='%23f6d9b4'/%3E%3Ccircle cx='37' cy='56' r='6' fill='%23fff'/%3E%3Ccircle cx='63' cy='56' r='6' fill='%23fff'/%3E%3Ccircle cx='39' cy='57' r='3' fill='%23111'/%3E%3Ccircle cx='65' cy='57' r='3' fill='%23111'/%3E%3Cpath d='M6 32Q50 14 94 32V44Q50 28 6 44Z' fill='%23d62839'/%3E%3Crect x='38' y='20' width='24' height='20' rx='5' fill='%23ffc857'/%3E%3Ctext x='50' y='37' text-anchor='middle' font-size='20' font-weight='900' font-family='Arial' fill='%238a1033'%3Ee%3C/text%3E%3C/svg%3E">
<style>
:root{
  --night:#0b0f2a; --night2:#171b45; --indigo:#2a2f6b; --paper:#fbf2dc; --paper2:#f3e4bd; --ink:#1d1b2e;
  --gold:#ffc857; --gold-d:#e0a526; --sakura:#ff7f9e; --sakura-d:#c2185b; --jade:#3fae6a; --jade-d:#1f7a45;
  --red:#d62839; --wood:#5e3a1a; --wood2:#8a5a2b; --cream:#fff6e2; --muted:#b9b6d6;
  --display:"Avenir Next","Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --tile:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --radius:18px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#0b0f2a}
body{margin:0;min-height:100vh;font-family:var(--body);font-size:1.0625rem;line-height:1.5;color:var(--cream);
  background:linear-gradient(180deg,#080b22 0%,#141a47 55%,#2b2556 100%) fixed;overflow-x:hidden}
body.modal-open{overflow:hidden}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.1}
p{margin:0}
button,a{font:inherit}
button{cursor:pointer}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--gold);color:#2a1a00;padding:.6rem 1rem;border-radius:10px;z-index:100;font-weight:800}
.skip:focus{left:8px}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px;border-radius:10px}
.ic{display:block;flex:none}

/* ---------- scenery ---------- */
#scenery{position:fixed;inset:0;z-index:0;pointer-events:none}
#scenery svg{width:100%;height:100%;display:block}
.petals{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.petals i{position:absolute;top:-30px;width:12px;height:9px;border-radius:70% 0 70% 0;background:var(--sakura);opacity:.7;animation:fall linear infinite}
.petals i:nth-child(1){left:8%;animation-duration:19s;animation-delay:-3s}
.petals i:nth-child(2){left:22%;animation-duration:24s;animation-delay:-11s;transform:scale(.8)}
.petals i:nth-child(3){left:41%;animation-duration:21s;animation-delay:-7s}
.petals i:nth-child(4){left:58%;animation-duration:27s;animation-delay:-16s;transform:scale(1.2)}
.petals i:nth-child(5){left:73%;animation-duration:20s;animation-delay:-1s}
.petals i:nth-child(6){left:90%;animation-duration:25s;animation-delay:-13s;transform:scale(.9)}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(40px,55vh) rotate(180deg)}100%{transform:translate(-20px,110vh) rotate(360deg)}}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(8,11,34,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.1)}
.top-in{max-width:1120px;margin:0 auto;padding:.55rem 1rem;display:flex;align-items:center;gap:.75rem;justify-content:space-between}
.brand{display:flex;align-items:center;gap:.6rem;color:var(--cream);text-decoration:none;font-family:var(--display);font-weight:900;font-size:1.15rem;letter-spacing:.01em}
.brand svg{width:40px;height:40px}
.tools{display:flex;gap:.45rem;align-items:center}
.tbtn{display:inline-flex;align-items:center;gap:.45rem;min-height:44px;padding:.4rem .85rem;border-radius:999px;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:var(--cream);font-weight:700;font-size:.95rem}
.tbtn:hover{background:rgba(255,255,255,.16)}
.tbtn[aria-pressed="false"]{opacity:.7}
.tbtn.gold{background:var(--gold);color:#2a1a00;border-color:#fff1b8}
.tbtn.gold:hover{background:#ffd77f}
@media (max-width:700px){.tbtn .lbl{display:none}.tbtn{padding:.4rem .7rem}.brand span{display:none}}

/* ---------- shared ---------- */
main{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:1.25rem 1rem 3rem}
main:focus{outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:.65rem 1.3rem;border-radius:14px;border:3px solid #2a1a00;background:var(--paper);color:var(--ink);font-weight:800;text-decoration:none;box-shadow:0 4px 0 #2a1a00;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2a1a00}
.btn.primary{background:var(--gold)}
.btn.jade{background:var(--jade);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--cream);border-color:rgba(255,255,255,.4);box-shadow:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- letter tiles + VCe word ---------- */
.vword{--tw:2.4rem;position:relative;display:inline-block;vertical-align:bottom;padding-top:calc(var(--tw)*.85)}
.vword.sm{--tw:1.55rem;padding-top:calc(var(--tw)*.8)}
.vword.lg{--tw:clamp(1.9rem,8.4vw,3.3rem)}
.vword.noarc{padding-top:0}
.vrow{display:flex}
.tile{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;width:var(--tw);height:calc(var(--tw)*1.25);
  font-family:var(--tile);font-weight:800;font-size:calc(var(--tw)*.8);color:var(--ink);line-height:1}
.tile::before{content:"";position:absolute;inset:2px;border-radius:calc(var(--tw)*.22);background:#fff7e3;box-shadow:0 3px 0 #c9b684,inset 0 0 0 2px #eadbb0;z-index:-1}
.tile.tv::before{background:linear-gradient(#ffe08f,var(--gold));box-shadow:0 3px 0 var(--gold-d),0 0 18px rgba(255,200,87,.85)}
.tile.tvs::before{background:#fff1c7;box-shadow:0 3px 0 #c9b684,inset 0 0 0 3px var(--gold)}
.tile.te{color:var(--sakura-d)}
.tile.te::before{background:#ffe6ec;box-shadow:inset 0 0 0 2px var(--sakura),0 3px 0 #e8a3b5}
.tile.te{opacity:.92}
.tile.slot::before{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55);border-radius:calc(var(--tw)*.22)}
.tile.slot{color:rgba(255,255,255,.75)}
.paper .tile.slot::before{background:rgba(29,27,46,.06);box-shadow:inset 0 0 0 3px rgba(29,27,46,.35)}
.paper .tile.slot{color:rgba(29,27,46,.55)}
.tile.arrive{animation:arrive .7s cubic-bezier(.2,.8,.2,1) both}
.tile.arrive::after{content:"";position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 65%);animation:puff .7s ease-out both;z-index:2;pointer-events:none}
@keyframes arrive{0%{transform:translate(160%,-170%) rotate(300deg) scale(.5);opacity:0}70%{opacity:1}100%{transform:none;opacity:.92}}
@keyframes puff{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.7);opacity:0}}
.varc{position:absolute;left:0;top:0;width:100%;height:calc(var(--tw)*.85);overflow:visible;pointer-events:none}
.varc path{fill:none;stroke:var(--sakura);stroke-width:3px;stroke-dasharray:7 6;stroke-linecap:round;vector-effect:non-scaling-stroke;animation:fadein .5s .3s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.cv{color:var(--gold);font-weight:900}
.ce{color:var(--sakura);font-weight:900;opacity:.9}
.paper .cv{color:#a86f00}.paper .ce{color:var(--sakura-d)}
.us{opacity:.6}

/* ---------- home: hero ---------- */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:1.5rem;align-items:center;padding:1rem 0 1.5rem}
.logo{font-family:var(--display);font-weight:900;font-size:clamp(2.8rem,9vw,5.6rem);line-height:.9;letter-spacing:-.025em;margin:0 0 .4rem;
  text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 40px rgba(255,200,87,.25)}
.logo small{display:block;font-size:.42em;letter-spacing:.02em;color:var(--gold);margin-top:.35em;font-weight:800}
.lede{font-size:clamp(1.1rem,2.6vw,1.35rem);color:#ece8ff;max-width:34ch;margin:.9rem 0 1.3rem}
.cta{display:flex;flex-wrap:wrap;gap:.75rem}
.demo{background:rgba(251,242,220,.08);border:2px solid rgba(255,255,255,.18);border-radius:26px;padding:1.2rem 1rem 1rem;text-align:center;position:relative}
.demo-stage{min-height:7.2rem;display:flex;align-items:flex-end;justify-content:center;padding-top:.5rem}
.demo-cap{min-height:3.2rem;margin:.9rem 0 .5rem;font-size:1.1rem;font-weight:700;color:#fff}
.demo .mascot{position:absolute;left:-10px;top:-34px;width:84px;height:84px;transform:rotate(-8deg)}
.shh{position:absolute;left:62px;top:-26px;background:var(--paper);color:var(--ink);font-weight:900;border-radius:14px 14px 14px 2px;padding:.15rem .6rem;font-size:.95rem;transform:rotate(-4deg)}

/* ---------- home: ranks + doors ---------- */
.rank{margin:1.1rem 0 1.8rem;position:relative}
.rank-head{display:flex;gap:1rem;align-items:center;margin-bottom:.9rem;flex-wrap:wrap}
.rank-head .belt{width:96px;flex:none}
.rank-head h2{font-size:clamp(1.5rem,4vw,2rem)}
.rank-head p{color:var(--muted);max-width:60ch}
.rank-prog{margin-left:auto;font-weight:800;color:var(--gold);white-space:nowrap}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.door{position:relative;display:flex;flex-direction:column;gap:.5rem;text-align:left;padding:1.1rem 1.1rem 1rem;color:var(--ink);text-decoration:none;
  background:
    linear-gradient(90deg,transparent 49%,rgba(94,58,26,.28) 49%,rgba(94,58,26,.28) 51%,transparent 51%) 0 0/50% 100%,
    linear-gradient(0deg,transparent 66%,rgba(94,58,26,.28) 66%,rgba(94,58,26,.28) 68%,transparent 68%) 0 0/100% 33.3%,
    linear-gradient(0deg,transparent 32%,rgba(94,58,26,.2) 32%,rgba(94,58,26,.2) 34%,transparent 34%) 0 0/100% 33.3%,
    var(--paper);
  border:5px solid var(--wood);border-radius:14px;box-shadow:0 6px 0 #2e1a09,0 14px 24px rgba(0,0,0,.35);border:5px solid var(--wood);font-family:var(--body);min-height:180px;transition:transform .12s}
.door:hover{transform:translateY(-3px)}
.door .art{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid var(--wood);font-size:1.9rem;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.door h3{font-size:1.3rem;background:rgba(251,242,220,.92);padding:0 .3rem;align-self:flex-start;border-radius:6px}
.door p{font-size:.95rem;background:rgba(251,242,220,.92);padding:.1rem .3rem;border-radius:6px}
.door .go{margin-top:auto;font-weight:900;color:var(--red);background:rgba(251,242,220,.92);align-self:flex-start;padding:.1rem .45rem;border-radius:6px;display:flex;gap:.35rem;align-items:center}
.door.done{background-color:#eaf6df}
.stamp{position:absolute;right:.7rem;top:.7rem;width:58px;height:58px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;transform:rotate(8deg);box-shadow:0 0 0 3px #fff inset,0 3px 0 rgba(0,0,0,.3)}
.door.trial{background:linear-gradient(135deg,#2b2556,#14183f);color:var(--cream);border-color:var(--gold);box-shadow:0 6px 0 #6b4a00,0 14px 24px rgba(0,0,0,.35)}
.door.trial h3,.door.trial p,.door.trial .go{background:transparent;color:var(--cream)}
.door.trial .go{color:var(--gold)}
.door.trial{padding-right:5.5rem;grid-column:1/-1;flex-direction:row;align-items:center;flex-wrap:wrap;min-height:0;gap:1rem}
.door.trial h3{flex:none}.door.trial p{flex:1;min-width:14rem}.door.trial .go{margin-top:0}
.door.trial .art{background:transparent;border:0;width:96px;height:48px;border-radius:0;box-shadow:none}
.door.locked{filter:grayscale(.85) brightness(.8);cursor:not-allowed}
.rank.locked .doors{opacity:.8}
.gate{display:flex;align-items:center;gap:.7rem;margin:0 0 .9rem;padding:.7rem 1rem;border-radius:14px;background:rgba(255,200,87,.12);border:2px dashed var(--gold);color:#ffe9b0;font-weight:700}
.foot{margin-top:2rem;text-align:center;color:var(--muted);font-size:.9rem}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:.5rem}

/* ---------- session ---------- */
.sbar{display:flex;align-items:center;gap:1rem;margin-bottom:.7rem;flex-wrap:wrap}
.sbar h1{font-size:clamp(1.4rem,4vw,2rem);display:flex;align-items:center;gap:.6rem;flex:1;min-width:12rem}
.sbar .lvl{font-size:.85rem;font-weight:800;background:var(--indigo);border:2px solid rgba(255,255,255,.25);padding:.2rem .7rem;border-radius:999px}
.lanterns{display:flex;gap:.2rem;justify-content:center;margin:.2rem 0 1rem;flex-wrap:wrap}
.lant{width:28px;height:40px;color:#46406d;transition:color .4s,filter .4s}
.lant.lit{color:#ffb347;filter:drop-shadow(0 0 8px rgba(255,190,70,.95))}
.arena{display:grid;grid-template-columns:270px 1fr;gap:1.25rem;align-items:start}
.arena>.sensei{grid-column:1;grid-row:1}.arena>.scroll{grid-column:2;grid-row:1}
#ptitle:focus,#rtitle:focus{outline:none}
.sensei{position:sticky;top:76px;display:flex;flex-direction:column;align-items:center;gap:.6rem}
.sensei .mascot{width:128px;height:128px}
.bubble{background:#fff;color:var(--ink);border-radius:20px;padding:.9rem 1rem;position:relative;width:100%;border:3px solid #2a1a00;box-shadow:0 5px 0 rgba(0,0,0,.3);font-size:1rem}
.bubble::before{content:"";position:absolute;top:-14px;left:50%;margin-left:-12px;border:12px solid transparent;border-bottom-color:#2a1a00;border-top:0}
.bubble b.h{display:block;font-family:var(--display);font-size:1.15rem;margin-bottom:.25rem}
.bubble.good{background:#e3f7e8;border-color:var(--jade-d)}.bubble.good::before{border-bottom-color:var(--jade-d)}
.bubble.bad{background:#fff0d6;border-color:#b86a00}.bubble.bad::before{border-bottom-color:#b86a00}
.bubble .next{margin-top:.8rem;width:100%}
.scroll{position:relative;color:var(--ink);padding:2.2rem 1.4rem 2rem;margin:0 .6rem}
.paper{background:
    repeating-linear-gradient(90deg,rgba(94,58,26,.035) 0 2px,transparent 2px 7px),
    linear-gradient(var(--paper),var(--paper2));border-radius:6px}
.scroll::before,.scroll::after{content:"";position:absolute;left:-14px;right:-14px;height:22px;border-radius:12px;
  background:linear-gradient(#a8743a,var(--wood));box-shadow:0 5px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.3)}
.scroll::before{top:-12px}.scroll::after{bottom:-12px}
.q-row{display:flex;gap:.8rem;align-items:center;justify-content:center;text-align:center;margin-bottom:1rem}
.q-text{font-family:var(--display);font-weight:800;font-size:clamp(1.25rem,3.2vw,1.65rem);line-height:1.25}
.say{flex:none;width:46px;height:46px;border-radius:50%;border:3px solid #2a1a00;background:var(--gold);color:#2a1a00;display:grid;place-items:center;box-shadow:0 3px 0 #2a1a00}
.say:active{transform:translateY(2px);box-shadow:0 1px 0 #2a1a00}
.stage{min-height:11rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;padding:.5rem 0 1rem;text-align:center}
.stage .eq{display:flex;align-items:flex-end;gap:.5rem;flex-wrap:wrap;justify-content:center}
.stage .op{font-family:var(--tile);font-weight:900;font-size:2rem;color:var(--wood);padding-bottom:.4rem}
.longbadge{width:7.5rem;height:7.5rem;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold) 60%,var(--gold-d));
  border:5px solid var(--wood);font-family:var(--tile);font-weight:900;font-size:4.2rem;color:#4a2b00;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.hintline{font-weight:700;color:#5a4a2a}
.clue{display:flex;gap:.7rem;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;max-width:30rem}
.clue .em{font-size:2.4rem;line-height:1}
.sent{font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,3.6vw,1.8rem);line-height:1.7;max-width:34rem}
.blank{display:inline-block;min-width:6.5rem;border-bottom:5px solid var(--wood);vertical-align:baseline;margin:0 .2rem;color:transparent}
.filled{color:#a86f00;border-bottom-color:var(--jade);padding:0 .3rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
.optw{position:relative;display:flex}
.opt{flex:1;display:flex;align-items:center;gap:.7rem;min-height:68px;padding:.6rem 3.4rem .6rem .8rem;text-align:left;border-radius:16px;
  border:4px solid #cbb98a;border-bottom-width:7px;background:#fffaf0;color:var(--ink);font-family:var(--tile);font-weight:800;font-size:clamp(1.25rem,3.4vw,1.7rem);position:relative}
.opt:hover:not([disabled]){border-color:var(--red);transform:translateY(-2px)}
.opt .key{flex:none;width:1.6rem;height:1.6rem;border-radius:7px;background:rgba(29,27,46,.1);font-size:.85rem;display:grid;place-items:center;font-family:var(--body)}
@media (hover:none){.opt .key{display:none}}
.opt .mark{position:absolute;right:.7rem;top:50%;transform:translateY(-50%)}
.opt.right{background:#d8f5df;border-color:var(--jade);color:#0f4f2a}
.opt.wrong{background:#ffe0e3;border-color:var(--red);color:#7a0f1a;animation:shake .4s}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default}
.optw .opt-say{position:absolute;right:.45rem;bottom:.55rem;width:36px;height:36px;border-radius:50%;border:2px solid rgba(29,27,46,.35);background:rgba(255,200,87,.85);color:#2a1a00;display:grid;place-items:center;z-index:2}
.optw .opt-say.has-mark{right:.45rem}
.optw .opt-say + .x{display:none}
.opt.right .mark,.opt.wrong .mark{right:3.1rem}
.star-stuck{position:absolute;left:-8px;top:-10px;color:#6b6b8a;transform:rotate(20deg);animation:stick .3s both}
@keyframes stick{from{transform:scale(2) rotate(120deg);opacity:0}to{transform:scale(1) rotate(20deg);opacity:1}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.flystar{position:fixed;left:0;top:0;z-index:9998;pointer-events:none;color:var(--gold);filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.chips{display:flex;gap:.6rem;flex-wrap:wrap}
.pat{font-size:clamp(1.4rem,4vw,1.9rem)}

/* ---------- results ---------- */
.result{max-width:640px;margin:1rem auto;text-align:center;padding:2rem 1.4rem;border-radius:26px;background:linear-gradient(180deg,#232a68,#141845);border:4px solid var(--gold);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.result h1{font-size:clamp(1.9rem,6vw,2.7rem);color:var(--gold);margin:.6rem 0}
.result .medal{margin:0 auto}
.stats{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin:1.1rem 0 1.4rem}
.stat{background:rgba(255,255,255,.1);border-radius:14px;padding:.6rem 1.1rem;font-weight:700}
.stat b{display:block;font-size:1.6rem;font-family:var(--display);color:var(--gold)}
.btns{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}

/* ---------- medals + modal ---------- */
.medal{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:3.4rem;position:relative;
  background:radial-gradient(circle at 35% 30%,#fff3c4,var(--gold) 55%,var(--gold-d));border:6px solid #fff1b8;box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 30px rgba(255,200,87,.5)}
.medal svg{width:68px;height:auto}
.medal.lock{background:#2b2f5c;border-color:#4a4f86;box-shadow:0 4px 0 rgba(0,0,0,.35);color:#8e92c9;font-size:2.4rem;font-weight:900}
.modal-back{position:fixed;inset:0;z-index:60;background:rgba(4,6,20,.78);display:grid;place-items:center;padding:1rem;animation:fadein .2s}
.modal{background:linear-gradient(180deg,#1d2260,#12163d);border:4px solid var(--gold);border-radius:24px;width:min(860px,100%);max-height:92vh;overflow:auto;padding:1.4rem;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h2{font-size:1.7rem;color:var(--gold);padding-right:3.4rem;margin-bottom:.3rem}
.modal .sub{color:var(--muted);margin-bottom:1rem}
.mclose{position:absolute;right:.8rem;top:.8rem;width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:var(--red);color:#fff;display:grid;place-items:center}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.8rem}
.bcell{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18);border-radius:18px;padding:.8rem .5rem;color:var(--cream);display:flex;flex-direction:column;align-items:center;gap:.4rem;font-weight:800;text-align:center}
.bcell.on{border-color:var(--gold);background:rgba(255,200,87,.14)}
.bcell .medal{width:84px;height:84px;font-size:2.3rem;border-width:4px}.bcell .medal svg{width:48px}
.bcell .lock{font-size:1.9rem}
.bdetail{margin-top:1rem;padding:.9rem 1rem;border-radius:14px;background:rgba(255,255,255,.09);min-height:3.5rem}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.tab{padding:.5rem 1rem;border-radius:999px;border:2px solid rgba(255,255,255,.3);background:transparent;color:var(--cream);font-weight:800}
.tab[aria-selected="true"]{background:var(--gold);color:#2a1a00;border-color:#fff1b8}
.pgroup{margin-bottom:1rem;background:rgba(255,255,255,.07);border-radius:16px;padding:.8rem 1rem}
.pgroup h3{font-size:1.15rem;margin-bottom:.5rem;color:#fff}
.wchip{display:inline-flex;align-items:center;gap:.4rem;margin:.2rem .3rem .2rem 0;padding:.35rem .8rem;border-radius:999px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-family:var(--tile);font-weight:800;font-size:1.1rem}
.wchip:hover{background:rgba(255,255,255,.22)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.8rem;margin-bottom:1rem}
.step{background:rgba(255,255,255,.09);border-radius:16px;padding:.9rem 1rem}
.step b{font-family:var(--display);color:var(--gold);font-size:1.1rem;display:block;margin-bottom:.2rem}
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:.8rem}
.gcard{background:var(--paper);color:var(--ink);border-radius:16px;padding:.8rem 1rem;border:4px solid var(--wood)}
.gcard h3{font-size:1.2rem;display:flex;justify-content:space-between;gap:.5rem;margin-bottom:.4rem}
.gcard .pair{display:flex;align-items:flex-end;gap:.4rem;margin:.2rem 0 .5rem;flex-wrap:nowrap}
.gcard .vword.sm{--tw:1.3rem;padding-top:calc(var(--tw)*.8)}
.gcard .pair .vword.noarc{padding-top:calc(var(--tw)*.8)}
.gcard .arrow{font-size:.85rem;white-space:nowrap}
.gcard .arrow{font-weight:900;color:var(--wood);padding-bottom:.35rem}
.rare{font-size:.85rem;font-weight:800;background:var(--sakura);color:#4d0820;padding:.1rem .5rem;border-radius:999px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--paper);color:var(--ink);border:3px solid #2a1a00;border-radius:14px;padding:.7rem 1.1rem;z-index:90;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.35);max-width:min(92vw,520px);text-align:center;animation:fadein .2s}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .demo{margin-top:1.6rem}
  .arena{grid-template-columns:1fr}
  .arena>.sensei,.arena>.scroll{grid-column:1;grid-row:auto}
  .sensei{position:static;order:2;flex-direction:row;align-items:flex-start;gap:.8rem}
  .sensei .mascot{width:84px;height:84px;flex:none}
  .bubble::before{top:22px;left:-14px;margin:0;border:12px solid transparent;border-right-color:#2a1a00;border-left:0}
  .bubble.good::before{border-right-color:var(--jade-d)}.bubble.bad::before{border-right-color:#b86a00}
  .bubble.good::before,.bubble.bad::before{border-bottom-color:transparent}
  .rank-prog{margin-left:0}
}
@media (max-width:520px){
  .opts{grid-template-columns:1fr}
  .scroll{padding:2rem .9rem 1.6rem;margin:0 .35rem}
  .logo{font-size:3rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .petals{display:none}
}

var VCE = (function () {
  'use strict';

  var VOWELS = 'aeiou';

    }
    return out;
  }

      vowel: vowel, word: answer, answer: answer, options: [answer].concat(decoys),
      prompt: 'Which word has the long ' + V + ' sound?',
      speak: 'Which word has the long ' + V + ' sound?'
    });
  }
  function sneak(shortW, longW, decoys) {
    return base('sneak', {
      shortWord: shortW, word: longW, answer: longW, options: [longW].concat(decoys),
      prompt: 'Silent E sneaks to the end of \u201C' + shortW + '\u201D. What is the new word?',
      speak: 'Silent E sneaks to the end of ' + shortW + '. What is the new word?'
    });
  }
  function pattern(word, clue, emoji, opts) {
    var g = groups(word)[0];
    var frame = word.slice(0, g.vi) + '\u0001' + word.slice(g.vi + 1, g.ei) + '\u0001' + word.slice(g.ei + 1);
    return base('pattern', {
      word: word, frame: frame, clue: clue, emoji: emoji || '', answer: g.pattern, options: opts || ['a_e', 'i_e', 'o_e', 'u_e'],

      before: before, after: after, word: answer, answer: answer, options: [answer].concat(decoys),

      speak: 'Read the sentence. ' + sentence.replace(/\s+/g, ' ')
    });
  }
  function forge(first, second, decoys) {
    return base('forge', {

    box.appendChild(h('div', { class: 'stats' }, h('div', { class: 'stat' }, h('b', { text: s.first + '/' + total }), 'right on the first try')));
    box.appendChild(h('div', { class: 'btns' },
      h('a', { class: 'btn primary', href: '#/' }, 'Back to the dojo'),
      h('button', { class: 'btn', onclick: function () { startSession(cfg); window.scrollTo(0, 0); } }, ic('retry', 18), cfg.quiz && !s.result.pass ? 'Try again' : 'Play again')));
    view.appendChild(box); var t = document.getElementById('rtitle'); if (t) t.focus({ preventScroll: true });
  }

  /* ---------- router ---------- */
  function route() {
    cleanups.forEach(function (f) { f(); }); cleanups = []; hush(); session = null;
    var seg = current.replace(/^\/?/, '').split('/');
    if (seg[0] === 'game') {
      var g = D.GAMES.filter(function (x) { return x.id === seg[1]; })[0];
      if (!g || !levelOpen(g.level)) return go('/');
      var badge = D.BADGES.filter(function (b) { return b.id === g.badge; })[0];
      startSession({ quiz: false, gameId: g.id, level: g.level, kind: g.kind, title: g.title, art: art(g.icon), tag: 'Level ' + g.level, questions: g.data, badge: badge });
    } else if (seg[0] === 'quiz') {
      var l = parseInt(seg[1], 10);
      if (!(l === 1 || l === 2) || !levelOpen(l) || !trialOpen(l)) return go('/');
      var L = D.LEVELS[l - 1], b2 = D.BADGES.filter(function (b) { return b.quiz === l; })[0];
      startSession({ quiz: true, level: l, kind: 'quiz', title: L.belt + ' Trial', art: art('belt' + l), tag: 'Level ' + l + ' trial', questions: l === 1 ? D.Q1 : D.Q2, badge: b2 });
    } else renderHome();
    updateCount(); window.scrollTo(0, 0);
    var f = document.getElementById('ptitle'); if (f) f.focus({ preventScroll: true });
  }
  var current = '/';
  function readHash() { try { return (location.hash || '').replace(/^#/, '') || '/'; } catch (e) { return '/'; } }
  function navigate(p, replace) {
    current = p || '/';
    try { if (replace) history.replaceState(null, '', '#' + current); else history.pushState(null, '', '#' + current); } catch (e) { /* sandboxed preview: in-memory only */ }
    route();
  }
  function go(p) { navigate(p, true); }

  document.addEventListener('keydown', function (e) {
    if (!session || session.done || modalStack || e.ctrlKey || e.metaKey || e.altKey) return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && !session.answered) { var b = view.querySelector('.opt[data-i="' + (n - 1) + '"]'); if (b) { e.preventDefault(); b.click(); } }
  });
  function fromUrl() { current = readHash(); route(); }
  window.addEventListener('hashchange', fromUrl);
  window.addEventListener('popstate', fromUrl);
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('a[href^="#/"]') : null;
    if (!el || e.defaultPrevented || e.button > 0 || e.metaKey || e.ctrlKey) return;
    e.preventDefault(); navigate(el.getAttribute('href').slice(1));
  });
  current = readHash(); buildShell(); route();
})();

</script>
</body>
</html>
